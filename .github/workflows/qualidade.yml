# Esteira de qualidade (Bloco 8): roda em todo Pull Request para a main e em
# todo merge. Se as contas, o build ou o teste no navegador falharem, o PR fica
# marcado com ❌ e (com a regra de proteção da main) o merge é bloqueado.
name: Qualidade

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: qualidade-${{ github.ref }}
  cancel-in-progress: true

jobs:
  testes:
    name: Testes e build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Lint e formatação (Biome)
        run: npm run lint

      - name: Testes das contas (Vitest, com cobertura mínima)
        run: npm run test:cobertura

      - name: Build de produção (PWA e arquivo único)
        run: |
          npm run build
          npm run build:single

      - name: Orçamento de tamanho (primeira tela leve no celular)
        run: npm run orcamento

      - name: Instalar o navegador dos testes
        run: npx playwright install --with-deps chromium

      - name: Testes no navegador (Playwright, celular e computador)
        run: npm run test:e2e

      - name: Guardar o relatório se algum teste falhar
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-dos-testes
          path: test-results/
          retention-days: 7
